{% extends "base.html" %}

{% block content %}

    <style>
        h1 {
            color: #0800B5;
            text-align: center;
        }

        .line1 {
            border: 1px solid #0800b5;
        }

        select, input {
            border-color: #0800b5;
            border-radius: 5px;
        }

        form {
            display: grid;
        }

        #but {
            color: white;
            background-color: #0800B5;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section {
            width: 100%;
            max-width: 40em;
            margin-bottom: 2em;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .btn-container {
            display: flex;
            justify-content: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-group label, .form-group input, .form-group select {
            width: 100%;
            max-width: 20em;
            margin-bottom: 1em;
        }

        #reserve-btn {
            background-color: #0800B5;
            color: white;
            padding: 0.5em 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }
    </style>

    <title>Reservar Recurso</title>

    <div class="container">
        <div class="section">
            <!-- Cabeçalho com título e botão -->
            <div class="header-section">
                <h2>Empréstimo de recurso</h2>
                <a href="{% url 'cadastrar_reserva_recurso' %}" id="reserve-btn">Reservar Recurso</a>
            </div>
            <div id='line1' class='line1'></div>
            <form method="post" action="{% url 'cadastrar_emprestimo' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="idRecurso">Recurso</label>
                    {{ reserva_form.idRecurso }}
                </div>
                <div class="form-group">
                    <label for="matBolsista">Matrícula do Bolsista</label>
                    {{ reserva_form.matBolsista }}
                </div>
                <div class="form-group">
                    <label for="matUsuario">Matrícula do Usuário</label>
                    {{ reserva_form.matUsuario }}
                </div>
                <div class="btn-container">
                    <button id="but" class="btn" type="submit">Confirmar Empréstimo</button>
                </div>
            </form>
        </div>
    </div>

{% endblock content %}
